# Tiny proof-of-concept config. Target: full pipeline on a laptop CPU in ~15-30 min.
# Every `type:` field is a registry key, so components can be swapped from the CLI, e.g.
#   python -m wmpoc.run --config configs/poc_tiny.yaml model.encoder.type=masked_ae

experiment:
  name: poc_tiny
  seed: 0
  device: auto            # auto | cpu | cuda | mps
  output_dir: runs/${experiment.name}

data:
  dir: data               # produced by data_gen/generate_fake_data.py
  categories: [bread, rolls, dairy, spreads, produce, drinks, snacks, household]
  target_category: bread
  action_categories: [bread]          # what the planner may change
  max_stores: null                    # e.g. 30 for a smoke run
  window:
    context_weeks: 8                  # weeks the encoder sees
    horizon_weeks: 4                  # weeks the world model predicts
    stride_weeks: 1
  split:                              # week indices [start, end); a gap of horizon_weeks
    train: [0, 104]                   # is enforced so no window crosses a boundary
    val: [104, 130]
    test: [130, 156]
    holdout_store_frac: 0.15          # cold-start stores: never in any training split
  token_features:                     # one token = one (category, week) cell
    - log_units_sold
    - log_net_price
    - discount
    - stockout_frac                   # stockout_hours / 78
    - waste_rate                      # waste_units / stock_units
    - log_stock_units
  price_features: [log_net_price, discount]     # removed from world-model targets
  context_features:                   # one extra token per week
    - week_of_year_sin
    - week_of_year_cos
    - national_holiday_onehot
    - regional_holiday
    - temp_c
    - rain_mm
  known_future_features:              # available for the predicted weeks
    - week_of_year_sin
    - week_of_year_cos
    - national_holiday_onehot
    - regional_holiday
    - temp_forecast_c
    - rain_forecast_mm
    - national_bread_flyer
    - planned_discount_non_action_categories
  static_store_features: [size_sqm, urban, income_index, competitor_dist_km, lidl_plus_share, region_onehot]
  normalization: fit_on_train_only
  randomized_sample_weight: 3.0       # weight of randomized bread weeks in stages 2 and 3

model:
  d_model: 64
  store_id_embedding:
    enabled: true
    dropout: 0.5                      # prob. of zeroing the ID vector per sample (forces inference from data)

  encoder:
    type: jepa                        # jepa | masked_ae | supervised | linear | random_frozen
    n_layers: 2
    n_heads: 4
    mlp_ratio: 2
    dropout: 0.1
    attention: factorized             # full | factorized (time axis, then category axis)
    pooling: none                     # none (keep per-category tokens) | mean
    masks:                            # shared by jepa and masked_ae; one mask type sampled per batch
      future: {p: 0.4, n_weeks: [1, 4]}
      category: {p: 0.3, n_categories: [1, 2]}
      price: {p: 0.15}                # every cell visible, price features blanked
      random_block: {p: 0.15, ratio: 0.3}
    jepa:
      predictor: {n_layers: 2, n_heads: 4, d_model: 48}
      ema: {start: 0.996, end: 0.9995}   # cosine schedule over pretraining
      loss: smooth_l1                 # l1 | l2 | smooth_l1 | cosine
      anticollapse: {type: vicreg, var_weight: 1.0, cov_weight: 0.04}   # none | vicreg
    masked_ae:
      decoder: {n_layers: 1}
      loss: huber                     # reconstructs raw scaled features of masked cells

  world_model:
    type: transformer                 # transformer | gru | additive | direct | no_action
    n_layers: 2
    n_heads: 4
    dropout: 0.1
    action_conditioning: adaln_and_token   # token | adaln | adaln_and_token
    teacher_forcing_weight: 1.0
    rollout_weight: 0.5
    rollout_steps: 4
    category_loss_weights: {bread: 3.0, rolls: 1.5, spreads: 1.5, default: 1.0}
    target_drops_price: true          # leakage fix: targets are encoded without price features
    ensemble_size: 3                  # independently seeded world models for planning

  outcome_heads:
    type: mlp
    hidden: [64]
    targets: [log_units_sold, waste_rate]   # per category; margin is computed, never learned
    train_on: real_embeddings         # real_embeddings | predicted_embeddings | both
    loss: huber
    censoring: tobit                  # none | exclude | tobit (sales = min(demand, stock))

training:
  batch_size: 128
  optimizer: adamw
  weight_decay: 0.05
  grad_clip: 1.0
  num_workers: 0
  stages:
    pretrain:       {enabled: true, epochs: 15, lr: 1.0e-3, warmup_frac: 0.05}
    world_model:    {enabled: true, epochs: 20, lr: 1.0e-3, freeze_encoder: true}
    outcome_heads:  {enabled: true, epochs: 10, lr: 1.0e-3}
    joint_finetune: {enabled: false, epochs: 5, lr: 1.0e-4, loss_weights: {latent: 1.0, outcome: 1.0}}
  early_stopping: {metric: val_loss, patience: 5}
  log_every_steps: 50

baselines:
  lightgbm:
    enabled: true
    lags: [1, 2, 3, 4, 8]
    num_leaves: 31
    n_estimators: 400
    learning_rate: 0.05
  diff_in_means: {enabled: true}      # effect estimate from randomized weeks only
  calendar_store_probe: {enabled: true}   # "does z know more than calendar + store ID?"

planning:
  discount_levels: [0.0, 0.1, 0.2, 0.3]
  action_sequence: "[d, 0, 0, 0]"     # same policy as the ground-truth counterfactuals
  objective: total_margin_4w
  risk_aversion: 1.0                  # score = ensemble mean - risk_aversion * ensemble std
  allow_untested_levels: false

eval:
  splits: [val, test]
  subsets: [all, randomized, cold_start_stores]
  probes:
    model: ridge
    cv: grouped_by_store
    targets: [bread_beta, size_sqm, holiday, traffic_shock]   # bread_beta and traffic_shock from ground_truth/
  knn_k: 10
  plots: true
